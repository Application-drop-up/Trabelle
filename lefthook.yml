pre-commit:
  parallel: true
  jobs:
    - name: frontend-lint
      # oxlint: Rust-based and fast, so it comes first for immediate pre-commit feedback
      root: frontend/
      glob: "*.{js,ts,jsx,tsx}"
      run: npm run lint:ox

    - name: frontend-format
      # Prettier (format:check): catch formatting drift before it's committed
      root: frontend/
      glob: "*.{js,ts,jsx,tsx,css}"
      run: npm run format:check

    - name: backend-lint
      # golangci-lint: bundles multiple Go linters, run via Docker to mirror the same checks as CI
      root: backend/
      glob: "*.go"
      run: docker compose -f ../infra/docker-compose.yml run --no-deps --rm go-lint golangci-lint run ./...

commit-msg:
  jobs:
    - name: commitlint
      # commitlint: keep commit messages consistent
      run: npx commitlint --edit {1}
